# ==============================================================================
# OpenSRE - AI-Powered Incident Response
# Production-ready Docker Compose configuration
# ==============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # OpenSRE Core
  # ---------------------------------------------------------------------------
  autosre:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/autosre-ai/autosre:${AUTOSRE_VERSION:-latest}
    container_name: autosre
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # LLM Configuration
      - AUTOSRE_LLM_PROVIDER=${AUTOSRE_LLM_PROVIDER:-ollama}
      - AUTOSRE_OLLAMA_HOST=http://ollama:11434
      - AUTOSRE_OLLAMA_MODEL=${AUTOSRE_OLLAMA_MODEL:-llama3.1:8b}
      - AUTOSRE_OPENAI_API_KEY=${AUTOSRE_OPENAI_API_KEY:-}
      - AUTOSRE_ANTHROPIC_API_KEY=${AUTOSRE_ANTHROPIC_API_KEY:-}
      
      # Infrastructure
      - AUTOSRE_PROMETHEUS_URL=${AUTOSRE_PROMETHEUS_URL:-http://prometheus:9090}
      
      # Slack
      - AUTOSRE_SLACK_BOT_TOKEN=${AUTOSRE_SLACK_BOT_TOKEN:-}
      - AUTOSRE_SLACK_APP_TOKEN=${AUTOSRE_SLACK_APP_TOKEN:-}
      - AUTOSRE_SLACK_CHANNEL=${AUTOSRE_SLACK_CHANNEL:-#incidents}
      
      # Database
      - AUTOSRE_DATABASE_URL=sqlite:///data/autosre.db
      
      # Logging
      - AUTOSRE_LOG_LEVEL=${AUTOSRE_LOG_LEVEL:-INFO}
    volumes:
      - ./config:/app/config:ro
      - ./runbooks:/app/runbooks:ro
      - ./agents:/app/agents:ro
      - autosre_data:/app/data
      - ${HOME}/.kube/config:/app/.kube/config:ro
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - autosre-network

  # ---------------------------------------------------------------------------
  # Ollama - Local LLM
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - autosre-network
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Redis - Message Bus & Cache (optional, for HA)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autosre-network
    profiles:
      - ha

volumes:
  autosre_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local

networks:
  autosre-network:
    driver: bridge
