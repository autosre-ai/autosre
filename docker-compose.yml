version: "3.9"

services:
  # =============================================================================
  # PostgreSQL - Primary relational database
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: autosre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autosre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-autosre}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - autosre-internal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autosre} -d ${POSTGRES_DB:-autosre}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # =============================================================================
  # Neo4j - Graph database for infrastructure topology
  # =============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: autosre-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - autosre-internal
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  # =============================================================================
  # Redis - Caching and pub/sub
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: autosre-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - autosre-internal
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M

  # =============================================================================
  # LiteLLM - LLM Proxy for unified API access
  # =============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: autosre-litellm
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-autosre-salt-key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosre}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autosre}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - autosre-internal
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # =============================================================================
  # SRE Agent - Main AI agent service
  # =============================================================================
  sre-agent:
    build:
      context: ./src/agent
      dockerfile: Dockerfile
    image: autosre/sre-agent:${VERSION:-latest}
    container_name: autosre-agent
    restart: unless-stopped
    environment:
      # Database connections
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosre}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autosre}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # LLM configuration
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o}
      # Agent configuration
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-300}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-3}
      # Security
      API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY required}
    volumes:
      - agent_data:/app/data
      - ./config:/app/config:ro
    networks:
      - autosre-internal
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  # =============================================================================
  # API Gateway - FastAPI REST API
  # =============================================================================
  api-gateway:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    image: autosre/api-gateway:${VERSION:-latest}
    container_name: autosre-api
    restart: unless-stopped
    environment:
      # Database connections
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosre}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autosre}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Service connections
      AGENT_URL: http://sre-agent:8080
      LITELLM_URL: http://litellm:4000
      # API configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: ${API_WORKERS:-4}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      # Security
      API_SECRET_KEY: ${API_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    networks:
      - autosre-internal
      - autosre-external
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sre-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # =============================================================================
  # Web UI - Next.js frontend
  # =============================================================================
  web-ui:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: autosre/web-ui:${VERSION:-latest}
    container_name: autosre-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
    networks:
      - autosre-external
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

# =============================================================================
# Networks
# =============================================================================
networks:
  autosre-internal:
    driver: bridge
    internal: true
  autosre-external:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local
  redis_data:
    driver: local
  agent_data:
    driver: local
