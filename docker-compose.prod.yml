version: "3.9"

# =============================================================================
# AutoSRE - Production-Ready AI SRE Platform
# =============================================================================
# 
# World-class containerized SRE agent for automated incident investigation
# No CLI dependencies, no local Ollama - pure container workloads
#
# Services:
#   - postgres: Primary database for config/memory
#   - neo4j: Service topology knowledge graph
#   - redis: Caching, pub/sub, rate limiting
#   - litellm: Multi-provider LLM proxy
#   - sre-agent: LangGraph investigation orchestrator
#   - api-gateway: External REST API
#   - web-ui: React dashboard
#   - config-service: Team/token management
#
# Usage:
#   make dev           Start all services
#   make stop          Stop everything
#   make logs          Follow all logs
#   make logs-agent    Follow agent logs
#   make clean         Remove containers + volumes
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Primary relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: autosre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autosre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-autosre}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - autosre-internal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autosre} -d ${POSTGRES_DB:-autosre}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Neo4j - Knowledge graph for service topology
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: autosre-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./database/neo4j/init:/docker-entrypoint-initdb.d:ro
    networks:
      - autosre-internal
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-localdev} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis - Caching, pub/sub, and rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: autosre-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - autosre-internal
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # LiteLLM - Multi-provider LLM proxy
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: autosre-litellm
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - autosre-internal
      - autosre-external
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # SRE Agent - LangGraph investigation orchestrator
  # ---------------------------------------------------------------------------
  sre-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: autosre-sre-agent
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autosre}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autosre}
      
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      
      # LLM via LiteLLM proxy
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-autosre}
      
      # Config service
      CONFIG_SERVICE_URL: http://config-service:8080
      
      # Agent settings
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-900}
      MAX_REACT_LOOPS: ${MAX_REACT_LOOPS:-25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Skills
      SKILLS_DIR: /app/skills
      ENABLED_SKILLS: ${ENABLED_SKILLS:-all}
    volumes:
      - ./skills:/app/skills:ro
      - agent_cache:/home/agent/.cache
    networks:
      - autosre-internal
    ports:
      - "${AGENT_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=500m
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # API Gateway - External REST API
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: autosre-api-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autosre}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autosre}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AGENT_SERVICE_URL: http://sre-agent:8000
      CONFIG_SERVICE_URL: http://config-service:8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - autosre-internal
      - autosre-external
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - sre-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Config Service - Team and token management
  # ---------------------------------------------------------------------------
  config-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.config
    container_name: autosre-config-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autosre}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autosre}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?TOKEN_PEPPER required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - autosre-internal
    ports:
      - "${CONFIG_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Web UI - React dashboard
  # ---------------------------------------------------------------------------
  web-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: autosre-web-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost:8000}
    networks:
      - autosre-external
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Slack Bot (optional)
  # ---------------------------------------------------------------------------
  slack-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.slack
    container_name: autosre-slack-bot
    restart: unless-stopped
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      API_URL: http://api-gateway:8000
    networks:
      - autosre-internal
      - autosre-external
    depends_on:
      - api-gateway
    profiles:
      - slack
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  autosre-internal:
    driver: bridge
    internal: true
  autosre-external:
    driver: bridge

volumes:
  postgres_data:
    name: autosre-postgres-data
  neo4j_data:
    name: autosre-neo4j-data
  neo4j_logs:
    name: autosre-neo4j-logs
  redis_data:
    name: autosre-redis-data
  agent_cache:
    name: autosre-agent-cache
