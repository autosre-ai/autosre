site_name: AutoSRE Documentation
site_description: AI-powered Site Reliability Engineering agent for autonomous incident investigation
site_url: https://autosre.io
site_author: AutoSRE Team

repo_name: autosre/autosre
repo_url: https://github.com/autosre/autosre
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024-2025 AutoSRE Contributors

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/autosre/autosre
    - icon: fontawesome/brands/slack
      link: https://autosre.io/slack
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/autosre
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - Concepts:
    - concepts/index.md
    - Architecture: concepts/architecture.md
    - Investigation Flow: concepts/investigation-flow.md
    - Memory System: concepts/memory-system.md
    - Skills System: concepts/skills.md
  - Guides:
    - guides/index.md
    - Slack Integration: guides/slack-integration.md
    - PagerDuty Integration: guides/pagerduty-integration.md
    - Custom Skills: guides/custom-skills.md
    - Kubernetes Deployment: guides/kubernetes-deployment.md
    - Scaling for Production: guides/scaling.md
  - Reference:
    - reference/index.md
    - API Reference: reference/api.md
    - CLI Reference: reference/cli.md
    - Configuration Options: reference/configuration.md
    - Environment Variables: reference/environment-variables.md
  - Development:
    - development/index.md
    - Contributing: development/contributing.md
    - Development Setup: development/development-setup.md
    - Testing: development/testing.md
    - Releasing: development/releasing.md
