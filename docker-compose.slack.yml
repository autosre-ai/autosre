# AutoSRE Slack Bot Service
#
# Docker Compose configuration for the Slack bot integration.
# Run with: docker-compose -f docker-compose.slack.yml up

version: "3.9"

services:
  # ============================================
  # Slack Bot Service
  # ============================================
  slack-bot:
    build:
      context: ./src/integrations/slack
      dockerfile: Dockerfile
    container_name: autosre-slack-bot
    restart: unless-stopped
    
    environment:
      # Slack credentials (required)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      
      # AutoSRE API connection
      - AUTOSRE_API_URL=${AUTOSRE_API_URL:-http://autosre-api:8000}
      
      # Optional: Health check port
      - HEALTH_PORT=8080
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    
    # Networking
    networks:
      - autosre-network
    
    # Dependencies
    depends_on:
      autosre-api:
        condition: service_healthy
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # AutoSRE API (reference for local dev)
  # ============================================
  autosre-api:
    image: autosre-api:latest
    container_name: autosre-api
    restart: unless-stopped
    
    environment:
      - ENV=${ENV:-development}
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    
    ports:
      - "8000:8000"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - autosre-network

# ============================================
# Networks
# ============================================
networks:
  autosre-network:
    driver: bridge
    name: autosre-network

