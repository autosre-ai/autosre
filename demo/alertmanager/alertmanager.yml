# Alertmanager configuration for AutoSRE demo
global:
  resolve_timeout: 5m

route:
  receiver: 'autosre-webhook'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts go immediately
    - match:
        severity: critical
      receiver: 'autosre-webhook'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  # Send alerts to AutoSRE for investigation
  - name: 'autosre-webhook'
    webhook_configs:
      - url: 'http://autosre-api:8000/api/v1/alerts/webhook'
        send_resolved: true
        max_alerts: 10

# Inhibition rules - suppress less severe alerts when critical fires
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
