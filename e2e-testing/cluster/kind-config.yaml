# Kind cluster configuration for AutoSRE E2E testing
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: autosre-e2e
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # Prometheus NodePort
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      # Grafana NodePort
      - containerPort: 30030
        hostPort: 3000
        protocol: TCP
    extraMounts:
      - hostPath: ./data
        containerPath: /data
        readOnly: false
  - role: worker
    extraMounts:
      - hostPath: ./data
        containerPath: /data
        readOnly: false
  - role: worker
    extraMounts:
      - hostPath: ./data
        containerPath: /data
        readOnly: false
