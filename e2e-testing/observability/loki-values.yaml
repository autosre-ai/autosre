# Loki Stack values for AutoSRE E2E testing
# Lightweight configuration for local log aggregation

loki:
  enabled: true
  persistence:
    enabled: false  # Use emptyDir for testing
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 5m
      chunk_retain_period: 30s
    schema_config:
      configs:
        - from: 2020-05-15
          store: boltdb
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 168h
    storage_config:
      boltdb:
        directory: /data/loki/index
      filesystem:
        directory: /data/loki/chunks
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    chunk_store_config:
      max_look_back_period: 0s
    table_manager:
      retention_deletes_enabled: false
      retention_period: 0s
  resources:
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

promtail:
  enabled: true
  config:
    lokiAddress: http://loki:3100/loki/api/v1/push
  resources:
    requests:
      memory: 50Mi
      cpu: 25m
    limits:
      memory: 128Mi
      cpu: 100m

grafana:
  enabled: false  # Using grafana from kube-prometheus-stack

prometheus:
  enabled: false  # Using prometheus from kube-prometheus-stack
