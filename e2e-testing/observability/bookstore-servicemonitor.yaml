# ServiceMonitor for Bookstore application
# Apply this after deploying the bookstore app
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bookstore
  namespace: monitoring
  labels:
    app: bookstore
    release: prometheus
spec:
  selector:
    matchLabels:
      app: bookstore
  namespaceSelector:
    matchNames:
      - default
      - bookstore
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# PrometheusRule for Bookstore alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bookstore-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: bookstore.rules
      rules:
        - alert: BookstoreHighErrorRate
          expr: |
            sum(rate(http_requests_total{app="bookstore", status=~"5.."}[5m])) 
            / sum(rate(http_requests_total{app="bookstore"}[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High error rate in Bookstore"
            description: "Error rate is {{ $value | humanizePercentage }} (>5%)"
        
        - alert: BookstoreHighLatency
          expr: |
            histogram_quantile(0.95, 
              sum(rate(http_request_duration_seconds_bucket{app="bookstore"}[5m])) by (le)
            ) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High latency in Bookstore"
            description: "P95 latency is {{ $value }}s (>1s)"
        
        - alert: BookstorePodNotReady
          expr: |
            kube_pod_status_ready{pod=~"bookstore.*", condition="true"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Bookstore pod not ready"
            description: "Pod {{ $labels.pod }} has been not ready for 1 minute"
