apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-config
  namespace: bookstore
data:
  DB_HOST: "bookstore-postgres"
  DB_PORT: "5432"
  DB_NAME: "bookstore"
  DB_USER: "bookstore"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: bookstore
data:
  init.sql: |
    -- Create books table
    CREATE TABLE IF NOT EXISTS books (
        id SERIAL PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        author VARCHAR(255) NOT NULL,
        isbn VARCHAR(20) UNIQUE NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        stock INTEGER DEFAULT 0,
        description TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create orders table
    CREATE TABLE IF NOT EXISTS orders (
        id UUID PRIMARY KEY,
        book_id INTEGER REFERENCES books(id),
        quantity INTEGER NOT NULL,
        customer_email VARCHAR(255) NOT NULL,
        total_price DECIMAL(10, 2) NOT NULL,
        status VARCHAR(50) DEFAULT 'pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Insert sample books
    INSERT INTO books (title, author, isbn, price, stock, description) VALUES
        ('The Pragmatic Programmer', 'David Thomas, Andrew Hunt', '978-0135957059', 49.99, 100, 'A guide to becoming a better programmer through pragmatic approaches.'),
        ('Clean Code', 'Robert C. Martin', '978-0132350884', 39.99, 75, 'A handbook of agile software craftsmanship.'),
        ('Design Patterns', 'Gang of Four', '978-0201633610', 59.99, 50, 'Elements of reusable object-oriented software.'),
        ('Site Reliability Engineering', 'Google SRE Team', '978-1491929124', 45.99, 120, 'How Google runs production systems.'),
        ('The Phoenix Project', 'Gene Kim', '978-1942788294', 24.99, 200, 'A novel about IT, DevOps, and helping your business win.'),
        ('Kubernetes in Action', 'Marko Luksa', '978-1617293726', 54.99, 80, 'A comprehensive guide to Kubernetes.'),
        ('Designing Data-Intensive Applications', 'Martin Kleppmann', '978-1449373320', 49.99, 90, 'The big ideas behind reliable, scalable, and maintainable systems.'),
        ('The DevOps Handbook', 'Gene Kim et al.', '978-1942788003', 34.99, 150, 'How to create world-class agility, reliability, and security.'),
        ('Accelerate', 'Nicole Forsgren et al.', '978-1942788331', 29.99, 110, 'The science of lean software and DevOps.'),
        ('Building Microservices', 'Sam Newman', '978-1492034025', 44.99, 85, 'Designing fine-grained systems.')
    ON CONFLICT (isbn) DO NOTHING;

    -- Create indexes
    CREATE INDEX IF NOT EXISTS idx_books_author ON books(author);
    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);
    CREATE INDEX IF NOT EXISTS idx_orders_customer ON orders(customer_email);
