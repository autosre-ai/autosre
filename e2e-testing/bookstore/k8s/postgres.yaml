apiVersion: v1
kind: Namespace
metadata:
  name: bookstore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: bookstore
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS books (
      id SERIAL PRIMARY KEY,
      title VARCHAR(255) NOT NULL,
      author VARCHAR(255) NOT NULL,
      price DECIMAL(10,2) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO books (title, author, price) VALUES 
      ('The SRE Book', 'Google', 49.99),
      ('Designing Data-Intensive Applications', 'Martin Kleppmann', 59.99),
      ('Site Reliability Engineering', 'Betsy Beyer', 54.99),
      ('Database Internals', 'Alex Petrov', 49.99),
      ('Building Microservices', 'Sam Newman', 44.99);
    
    CREATE TABLE IF NOT EXISTS orders (
      id SERIAL PRIMARY KEY,
      book_id INTEGER REFERENCES books(id),
      quantity INTEGER NOT NULL,
      status VARCHAR(50) DEFAULT 'pending',
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: bookstore
type: Opaque
stringData:
  POSTGRES_USER: bookstore
  POSTGRES_PASSWORD: bookstore123
  POSTGRES_DB: bookstore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bookstore
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "bookstore"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bookstore
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
