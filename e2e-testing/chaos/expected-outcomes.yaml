# Expected Outcomes for Chaos Scenarios
# This file documents what AutoSRE should detect for each scenario

scenarios:
  scenario-1-high-error-rate:
    name: "High Error Rate (50%)"
    chaos_type: "error_injection"
    duration: "~30 seconds active injection"
    
    expected_detection:
      primary_signal: "5xx error rate spike"
      metrics:
        - name: "http_requests_total{status=~'5..'}"
          expected: "50% increase from baseline"
        - name: "http_error_rate"
          expected: ">= 0.5 (50%)"
      
    expected_diagnosis:
      root_cause: "Application error injection (chaos endpoint)"
      affected_service: "bookstore-api"
      confidence: "high"
      
    expected_recommendations:
      - type: "investigate"
        action: "Check application logs for error patterns"
      - type: "rollback"
        action: "Consider rollback if correlated with recent deployment"
      
    success_criteria:
      - "AutoSRE detects error rate anomaly within 2 minutes"
      - "AutoSRE correctly identifies bookstore-api as affected service"
      - "AutoSRE does NOT blame database or external services"

  scenario-2-oom-kill:
    name: "OOM Kill"
    chaos_type: "resource_exhaustion"
    duration: "1-3 minutes until OOM"
    
    expected_detection:
      primary_signal: "OOMKilled container restart"
      metrics:
        - name: "container_memory_usage_bytes"
          expected: "Rapid increase to limit"
        - name: "kube_pod_container_status_restarts_total"
          expected: "Increment by 1+"
      events:
        - type: "Warning"
          reason: "OOMKilling"
          
    expected_diagnosis:
      root_cause: "Memory leak causing OOM"
      affected_service: "bookstore-api"
      evidence:
        - "Memory usage trend"
        - "OOMKilled event"
        - "Container restart"
      
    expected_recommendations:
      - type: "immediate"
        action: "Increase memory limits temporarily"
      - type: "investigate"
        action: "Profile memory usage, look for leaks"
      - type: "scale"
        action: "Add replicas to distribute memory pressure"
        
    success_criteria:
      - "AutoSRE detects OOMKilled within 1 minute of occurrence"
      - "AutoSRE identifies memory leak pattern"
      - "AutoSRE suggests memory limit increase"

  scenario-3-db-connection-exhaustion:
    name: "Database Connection Pool Exhaustion"
    chaos_type: "dependency_saturation"
    duration: "Immediate effect"
    
    expected_detection:
      primary_signal: "Connection timeout errors"
      metrics:
        - name: "db_pool_connections_active"
          expected: "At max"
        - name: "db_pool_connections_waiting"
          expected: "Increasing"
        - name: "http_request_duration_seconds"
          expected: "Timeout-level latency"
      logs:
        patterns:
          - "connection pool exhausted"
          - "timeout waiting for connection"
          - "too many connections"
          
    expected_diagnosis:
      root_cause: "Connection pool saturation"
      affected_service: "bookstore-api"
      upstream_cause: "Either traffic spike or connection leak"
      
    expected_recommendations:
      - type: "immediate"
        action: "Restart affected pods to release connections"
      - type: "config"
        action: "Increase connection pool size"
      - type: "investigate"
        action: "Check for connection leaks in code"
        
    success_criteria:
      - "AutoSRE identifies database connection issues"
      - "AutoSRE distinguishes from database being down"
      - "AutoSRE correlates with connection pool metrics"

  scenario-4-cascade-failure:
    name: "Cascade Failure (Database Down)"
    chaos_type: "dependency_failure"
    duration: "Until postgres recovers"
    
    expected_detection:
      primary_signal: "Database unavailable → API failures"
      metrics:
        - name: "up{service='postgres'}"
          expected: "0 (down)"
        - name: "http_requests_total{status='503'}"
          expected: "Spike"
      sequence:
        - "postgres pod deleted"
        - "bookstore-api connection errors"
        - "5xx responses to clients"
        
    expected_diagnosis:
      root_cause: "postgres outage"
      NOT_root_cause: "bookstore-api (it's a victim)"
      affected_services:
        - "postgres (primary)"
        - "bookstore-api (secondary)"
      cascade_detected: true
      
    expected_recommendations:
      - type: "immediate"
        action: "Restore postgres service"
      - type: "info"
        action: "bookstore-api will recover automatically once postgres is up"
        
    success_criteria:
      - "AutoSRE correctly identifies postgres as root cause"
      - "AutoSRE does NOT blame bookstore-api as root cause"
      - "AutoSRE understands dependency chain"
      - "AutoSRE predicts recovery once postgres is restored"

  scenario-5-latency-spike:
    name: "Latency Spike"
    chaos_type: "latency_injection"
    duration: "Until reset"
    
    expected_detection:
      primary_signal: "P99 latency increase"
      metrics:
        - name: "http_request_duration_seconds{quantile='0.99'}"
          expected: ">= 2s (injected latency)"
        - name: "http_request_duration_seconds{quantile='0.5'}"
          expected: ">= 2s"
      
    expected_diagnosis:
      root_cause: "Artificial latency injection"
      affected_service: "bookstore-api"
      pattern: "Uniform latency increase (not gradual degradation)"
      
    expected_recommendations:
      - type: "investigate"
        action: "Check for slow dependencies or queries"
      - type: "investigate"
        action: "Review recent deployments"
      - type: "mitigate"
        action: "Consider timeout adjustments if affecting downstream"
        
    success_criteria:
      - "AutoSRE detects latency anomaly"
      - "AutoSRE quantifies impact (e.g., '2s added latency')"
      - "AutoSRE identifies affected endpoints"

  scenario-6-cpu-throttling:
    name: "CPU Throttling/Stress"
    chaos_type: "resource_saturation"
    duration: "Until reset"
    
    expected_detection:
      primary_signal: "CPU throttling"
      metrics:
        - name: "container_cpu_usage_seconds_total"
          expected: "At limit"
        - name: "container_cpu_cfs_throttled_periods_total"
          expected: "Increasing"
        - name: "http_request_duration_seconds"
          expected: "Increased due to CPU starvation"
      
    expected_diagnosis:
      root_cause: "CPU saturation/throttling"
      affected_service: "bookstore-api"
      evidence:
        - "CPU usage at limit"
        - "CFS throttling active"
        - "Response time degradation"
      
    expected_recommendations:
      - type: "immediate"
        action: "Scale horizontally (add replicas)"
      - type: "config"
        action: "Increase CPU limits"
      - type: "investigate"
        action: "Profile for CPU-intensive operations"
        
    success_criteria:
      - "AutoSRE detects CPU saturation"
      - "AutoSRE correlates throttling with latency impact"
      - "AutoSRE suggests scaling or limit increase"

# Validation checklist for all scenarios
validation:
  timing:
    - "Detection within SLO (typically 2-5 minutes)"
    - "Alert correlation works correctly"
    
  accuracy:
    - "No false positives during chaos"
    - "Correct root cause identification"
    - "Correct affected service identification"
    
  completeness:
    - "All relevant metrics cited"
    - "Timeline reconstruction accurate"
    - "Recommendations are actionable"
    
  intelligence:
    - "Cascade failures correctly attributed"
    - "Symptoms distinguished from causes"
    - "Similar past incidents referenced (if any)"
