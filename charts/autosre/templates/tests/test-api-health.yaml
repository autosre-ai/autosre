{{- if .Values.api.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "autosre.fullname" . }}-test-api-health"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-api-health
      image: curlimages/curl:8.4.0
      command: ['sh', '-c']
      args:
        - |
          echo "Testing API health endpoints..."
          
          # Test liveness
          echo "Testing /health/live..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://{{ include "autosre.api.fullname" . }}:{{ .Values.service.api.port }}/health/live)
          if [ "$response" = "200" ]; then
            echo "Liveness check passed"
          else
            echo "Liveness check failed with status $response"
            exit 1
          fi
          
          # Test readiness
          echo "Testing /health/ready..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://{{ include "autosre.api.fullname" . }}:{{ .Values.service.api.port }}/health/ready)
          if [ "$response" = "200" ]; then
            echo "Readiness check passed"
          else
            echo "Readiness check failed with status $response"
            exit 1
          fi
          
          # Test API version endpoint (optional)
          echo "Testing /api/v1/version..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://{{ include "autosre.api.fullname" . }}:{{ .Values.service.api.port }}/api/v1/version)
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "Version endpoint check completed (status: $response)"
          else
            echo "Version endpoint check failed with unexpected status $response"
          fi
          
          echo "All health checks passed!"
{{- end }}
