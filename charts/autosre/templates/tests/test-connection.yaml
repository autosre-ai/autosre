apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "autosre.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    {{- if .Values.api.enabled }}
    - name: test-api
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Testing API connection..."
          wget -q --spider --timeout=5 http://{{ include "autosre.api.fullname" . }}:{{ .Values.service.api.port }}/health/ready
          if [ $? -eq 0 ]; then
            echo "API connection successful"
          else
            echo "API connection failed"
            exit 1
          fi
    {{- end }}
    {{- if .Values.web.enabled }}
    - name: test-web
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Testing Web connection..."
          wget -q --spider --timeout=5 http://{{ include "autosre.web.fullname" . }}:{{ .Values.service.web.port }}/
          if [ $? -eq 0 ]; then
            echo "Web connection successful"
          else
            echo "Web connection failed"
            exit 1
          fi
    {{- end }}
    {{- if .Values.agent.enabled }}
    - name: test-agent
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Testing Agent connection..."
          wget -q --spider --timeout=5 http://{{ include "autosre.agent.fullname" . }}:{{ .Values.service.agent.port }}/health/ready
          if [ $? -eq 0 ]; then
            echo "Agent connection successful"
          else
            echo "Agent connection failed"
            exit 1
          fi
    {{- end }}
