{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosre.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  # Database passwords
  {{- if .Values.secrets.databasePassword }}
  database-password: {{ .Values.secrets.databasePassword | b64enc | quote }}
  {{- else }}
  database-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.neo4jPassword }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | b64enc | quote }}
  {{- else }}
  neo4j-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  # AI provider keys
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.azureOpenaiApiKey }}
  azure-openai-api-key: {{ .Values.secrets.azureOpenaiApiKey | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.azureOpenaiEndpoint }}
  azure-openai-endpoint: {{ .Values.secrets.azureOpenaiEndpoint | b64enc | quote }}
  {{- end }}
  
  # Integration credentials
  {{- if .Values.secrets.slackBotToken }}
  slack-bot-token: {{ .Values.secrets.slackBotToken | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.slackSigningSecret }}
  slack-signing-secret: {{ .Values.secrets.slackSigningSecret | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.pagerdutyApiKey }}
  pagerduty-api-key: {{ .Values.secrets.pagerdutyApiKey | b64enc | quote }}
  {{- end }}
  
  # Security keys
  {{- if .Values.secrets.jwtSecretKey }}
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | b64enc | quote }}
  {{- else }}
  jwt-secret-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.secrets.encryptionKey }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- else }}
  encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
