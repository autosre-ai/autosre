{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autosre.agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autosre.agent.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.agent.type }}
  ports:
    - port: {{ .Values.service.agent.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.config.metricsEnabled }}
    - port: {{ .Values.config.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "autosre.agent.selectorLabels" . | nindent 4 }}
{{- end }}
