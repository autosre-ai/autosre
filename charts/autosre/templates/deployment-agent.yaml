{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autosre.agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autosre.agent.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.agent.autoscaling.enabled }}
  replicas: {{ .Values.agent.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "autosre.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "autosre.checksums" . | nindent 8 }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "autosre.agent.labels" . | nindent 8 }}
    spec:
      {{- include "autosre.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "autosre.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          image: {{ include "autosre.agent.image" . }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.agent.port }}
              protocol: TCP
            {{- if .Values.config.metricsEnabled }}
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "autosre.configMapName" . }}
          env:
            # Database credentials
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.postgresql.secretName" . }}
                  key: database-password
            - name: DATABASE_URL
              value: "postgresql://{{ include "autosre.postgresql.username" . }}:$(DATABASE_PASSWORD)@{{ include "autosre.postgresql.host" . }}:{{ include "autosre.postgresql.port" . }}/{{ include "autosre.postgresql.database" . }}"
            # Redis credentials
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.redis.secretName" . }}
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "autosre.redis.host" . }}:{{ include "autosre.redis.port" . }}"
            # Neo4j credentials
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.neo4j.secretName" . }}
                  key: neo4j-password
            - name: NEO4J_URI
              value: {{ include "autosre.neo4j.uri" . | quote }}
            - name: NEO4J_USERNAME
              value: {{ include "autosre.neo4j.username" . | quote }}
            # AI Provider credentials
            {{- if eq .Values.config.aiProvider "openai" }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: openai-api-key
            {{- end }}
            {{- if eq .Values.config.aiProvider "anthropic" }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: anthropic-api-key
            {{- end }}
            {{- if eq .Values.config.aiProvider "azure" }}
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: azure-openai-api-key
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: azure-openai-endpoint
            {{- end }}
            # Integration credentials
            {{- if .Values.config.slackEnabled }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: slack-bot-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: slack-signing-secret
            {{- end }}
            {{- if .Values.config.pagerdutyEnabled }}
            - name: PAGERDUTY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: pagerduty-api-key
            {{- end }}
            # Encryption key
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: encryption-key
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.agent.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.agent.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.agent.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.agent.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.agent.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.agent.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.agent.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.agent.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.agent.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.agent.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.agent.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.agent.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/autosre/.cache
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        {{- with .Values.agent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
