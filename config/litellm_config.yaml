# =============================================================================
# LiteLLM Proxy Configuration
# =============================================================================

model_list:
  # OpenAI Models
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096
    model_info:
      mode: chat
      
  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096
    model_info:
      mode: chat

  - model_name: gpt-4-turbo
    litellm_params:
      model: gpt-4-turbo-preview
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096
    model_info:
      mode: chat

  # Anthropic Models
  - model_name: claude-sonnet
    litellm_params:
      model: claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096
    model_info:
      mode: chat

  - model_name: claude-opus
    litellm_params:
      model: claude-opus-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096
    model_info:
      mode: chat

  - model_name: claude-haiku
    litellm_params:
      model: claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096
    model_info:
      mode: chat

  # Embeddings
  - model_name: text-embedding-3-small
    litellm_params:
      model: text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding

  - model_name: text-embedding-3-large
    litellm_params:
      model: text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding

# General settings
litellm_settings:
  # Caching
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    
  # Logging
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  
  # Rate limiting
  max_budget: 100.0
  budget_duration: 30d
  
  # Retry settings
  num_retries: 3
  request_timeout: 120
  
  # Fallbacks
  fallbacks:
    - gpt-4o: [gpt-4-turbo, claude-sonnet]
    - claude-sonnet: [gpt-4o, claude-haiku]

# Router settings
router_settings:
  routing_strategy: least-busy
  enable_pre_call_checks: true
  allowed_fails: 3
  cooldown_time: 60

# General config
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  
  # CORS
  allow_requests_from_all_origins: false
  allowed_origins:
    - http://localhost:3000
    - http://localhost:8000
