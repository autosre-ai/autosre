[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosre-ai"
version = "0.2.2"
description = "Open-source AI SRE agent - foundation-first incident investigation, root cause analysis, and auto-remediation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "AutoSRE AI", email = "hello@autosre.ai" }
]
keywords = [
    "sre", "devops", "kubernetes", "incident-response", "observability",
    "prometheus", "ai", "llm", "automation", "runbooks", "on-call"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Environment :: Console",
]
dependencies = [
    # CLI
    "typer>=0.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    
    # Core
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.2.2",
    
    # HTTP & Async
    "httpx>=0.25.0",
    "aiofiles>=24.0.0",
    
    # LLM - Required for investigations
    "anthropic>=0.18.0",
    "openai>=1.10.0",
    "litellm>=1.50.0",
    
    # LangGraph orchestration
    "langgraph>=1.0.0",
    "langchain>=1.3.1",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    
    # Infrastructure
    "kubernetes>=28.0.0",
    "boto3>=1.34.0",
    
    # Observability
    "prometheus-client>=0.25.0",
    "datadog-api-client>=2.20.0",
    
    # Database
    "neo4j>=5.14.0",
    "langchain-neo4j>=0.1.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    
    # API Server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0.0",
    "websockets>=12.0",
    
    # Integrations
    "slack-sdk>=3.27.0",
    "atlassian-python-api>=3.41.0",
    "PyGithub>=2.1.0",
]

[project.optional-dependencies]
minimal = [
    # Just the essentials for basic operation
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]
sandbox = [
    "docker>=7.0.0",
]
operator = [
    # Kubernetes operator framework
    "kopf>=1.37.0",
]
training = [
    # Fine-tuning dependencies
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "datasets>=2.17.0",
    "bitsandbytes>=0.42.0",
    "accelerate>=0.27.0",
    "trl>=0.7.0",
    "sentencepiece>=0.2.0",
    "scipy>=1.12.0",
    "nltk>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.20.2",
    "types-PyYAML>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-minify-plugin>=0.7.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "pymdown-extensions>=10.0.0",
]

[project.scripts]
autosre = "autosre.cli.main:cli"
autosre-v2 = "autosre.cli_v2:app"

[project.urls]
Homepage = "https://github.com/opensre/autosre"
Documentation = "https://github.com/opensre/autosre#readme"
Repository = "https://github.com/opensre/autosre"
Issues = "https://github.com/opensre/autosre/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/autosre"]

[tool.hatch.build.targets.sdist]
include = [
    "src/autosre/",
    "scenarios/",
    "docs/",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
