[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -v --tb=short --cov=autosre --cov-report=term-missing --cov-report=html
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require mocked services)
    e2e: End-to-end tests (full flow)
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
env =
    AUTOSRE_DEBUG=true
    AUTOSRE_TEST_MODE=true
