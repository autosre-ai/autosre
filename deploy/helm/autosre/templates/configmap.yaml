apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autosre.fullname" . }}-config
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
data:
  # Agent configuration
  AGENT_LOG_LEVEL: {{ .Values.agent.config.logLevel | quote }}
  AGENT_TIMEOUT: {{ .Values.agent.config.timeout | quote }}
  AGENT_MAX_RETRIES: {{ .Values.agent.config.maxRetries | quote }}
  DEFAULT_MODEL: {{ .Values.agent.config.defaultModel | quote }}

  # API configuration
  API_HOST: "0.0.0.0"
  API_PORT: {{ .Values.api.service.port | quote }}
  API_WORKERS: {{ .Values.api.config.workers | quote }}
  API_LOG_LEVEL: {{ .Values.api.config.logLevel | quote }}
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: {{ .Values.api.config.jwtExpirationHours | quote }}
  CORS_ORIGINS: {{ .Values.api.config.corsOrigins | quote }}

  # Web configuration
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: {{ .Values.web.config.publicApiUrl | quote }}
  NEXTAUTH_URL: {{ printf "https://%s" .Values.ingress.hosts.web | quote }}

  # Internal service URLs
  AGENT_URL: {{ include "autosre.agent.url" . | quote }}
  LITELLM_URL: {{ include "autosre.config.url" . | quote }}

  # Global settings
  ENVIRONMENT: {{ .Values.global.environment | quote }}
---
{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autosre.fullname" . }}-litellm
  labels:
    {{- include "autosre.config.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Values.config.configYaml | nindent 4 }}
{{- end }}
