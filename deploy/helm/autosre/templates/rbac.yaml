{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "autosre.fullname" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
rules:
  # Core resources - read access
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - secrets
      - namespaces
      - nodes
      - events
    verbs: ["get", "list", "watch"]
  
  # Core resources - write access for remediation
  - apiGroups: [""]
    resources:
      - pods
      - pods/eviction
    verbs: ["delete", "create"]
  
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["update", "patch"]
  
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch", "update", "patch"]
  
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - replicasets/scale
      - statefulsets/scale
    verbs: ["get", "update", "patch"]
  
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "delete"]
  
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "update", "patch"]
  
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  
  # Policy
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  
  # Metrics
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "autosre.fullname" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "autosre.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autosre.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autosre.fullname" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
rules:
  # Core resources - read access
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - secrets
      - events
    verbs: ["get", "list", "watch"]
  
  # Core resources - write access for remediation
  - apiGroups: [""]
    resources:
      - pods
      - pods/eviction
    verbs: ["delete", "create"]
  
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["update", "patch"]
  
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch", "update", "patch"]
  
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - replicasets/scale
      - statefulsets/scale
    verbs: ["get", "update", "patch"]
  
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "delete"]
  
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "update", "patch"]
  
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  
  # Policy
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  
  # Metrics
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
    verbs: ["get", "list"]
  
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autosre.fullname" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autosre.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autosre.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.allowedNamespaces }}
{{- range .Values.rbac.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autosre.fullname" $ }}-{{ . }}
  namespace: {{ . }}
  labels:
    {{- include "autosre.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autosre.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autosre.api.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
