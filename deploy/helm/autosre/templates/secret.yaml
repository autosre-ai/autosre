{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosre.secretsName" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  # Generate a random JWT secret if not provided
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if and (not .Values.postgresql.enabled) (not .Values.externalPostgresql.existingSecret) .Values.externalPostgresql.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosre.fullname" . }}-external-postgresql
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
type: Opaque
data:
  postgresql-password: {{ .Values.externalPostgresql.password | b64enc | quote }}
{{- end }}
---
{{- if and (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) .Values.externalRedis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosre.fullname" . }}-external-redis
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
type: Opaque
data:
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
{{- end }}
