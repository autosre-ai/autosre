{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosre.fullname" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: {{ .Values.secrets.database.user | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.database.password is required" .Values.secrets.database.password | quote }}
  POSTGRES_DB: {{ .Values.secrets.database.name | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" .Values.secrets.database.user .Values.secrets.database.password (include "autosre.postgresql.host" .) (include "autosre.postgresql.port" . | int) .Values.secrets.database.name | quote }}

  # Neo4j credentials
  NEO4J_USER: {{ .Values.secrets.neo4j.user | quote }}
  NEO4J_PASSWORD: {{ required "secrets.neo4j.password is required" .Values.secrets.neo4j.password | quote }}
  NEO4J_URI: {{ include "autosre.neo4j.uri" . | quote }}

  # Redis credentials
  REDIS_PASSWORD: {{ required "secrets.redis.password is required" .Values.secrets.redis.password | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s:%d/0" .Values.secrets.redis.password (include "autosre.redis.host" .) (include "autosre.redis.port" . | int) | quote }}
  REDIS_HOST: {{ include "autosre.redis.host" . | quote }}
  REDIS_PORT: {{ include "autosre.redis.port" . | quote }}

  # LiteLLM credentials
  LITELLM_MASTER_KEY: {{ required "secrets.litellm.masterKey is required" .Values.secrets.litellm.masterKey | quote }}
  LITELLM_SALT_KEY: {{ default "autosre-salt-key" .Values.secrets.litellm.saltKey | quote }}

  # API security keys
  API_SECRET_KEY: {{ required "secrets.api.secretKey is required" .Values.secrets.api.secretKey | quote }}
  JWT_SECRET_KEY: {{ required "secrets.api.jwtSecretKey is required" .Values.secrets.api.jwtSecretKey | quote }}

  # NextAuth secret
  NEXTAUTH_SECRET: {{ required "secrets.nextauth.secret is required" .Values.secrets.nextauth.secret | quote }}

  # LLM API keys (optional)
  {{- if .Values.secrets.llm.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.llm.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.llm.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.azureApiKey }}
  AZURE_API_KEY: {{ .Values.secrets.llm.azureApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.azureApiBase }}
  AZURE_API_BASE: {{ .Values.secrets.llm.azureApiBase | quote }}
  {{- end }}
{{- end }}
