{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autosre.fullname" . }}-api
  labels:
    {{- include "autosre.api.labels" . | nindent 4 }}
  {{- with (merge .Values.api.podAnnotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "autosre.api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "autosre.api.labels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "autosre.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "autosre.api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: {{ include "autosre.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: DATABASE_HOST
              value: {{ include "autosre.postgresql.host" . | quote }}
            - name: DATABASE_PORT
              value: {{ include "autosre.postgresql.port" . | quote }}
            - name: DATABASE_NAME
              value: {{ include "autosre.postgresql.database" . | quote }}
            - name: DATABASE_USER
              value: {{ include "autosre.postgresql.username" . | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.postgresql.secretName" . }}
                  key: {{ include "autosre.postgresql.secretKey" . }}
            {{- if not .Values.postgresql.enabled }}
            - name: DATABASE_SSL_MODE
              value: {{ .Values.externalPostgresql.sslMode | quote }}
            {{- end }}
            - name: REDIS_HOST
              value: {{ include "autosre.redis.host" . | quote }}
            - name: REDIS_PORT
              value: {{ include "autosre.redis.port" . | quote }}
            {{- if or .Values.redis.enabled (and (not .Values.redis.enabled) .Values.externalRedis.password) (and (not .Values.redis.enabled) .Values.externalRedis.existingSecret) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.redis.secretName" . }}
                  key: {{ include "autosre.redis.secretKey" . }}
            {{- end }}
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.tls }}
            - name: REDIS_TLS_ENABLED
              value: "true"
            {{- end }}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.configMapName" . }}
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.configMapName" . }}
                  key: LOG_FORMAT
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.configMapName" . }}
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.configMapName" . }}
                  key: AI_MODEL
            {{- if or .Values.secrets.openaiApiKey .Values.secrets.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretsName" . }}
                  key: openai-api-key
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.anthropicApiKey .Values.secrets.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretsName" . }}
                  key: anthropic-api-key
                  optional: true
            {{- end }}
            {{- if or .Values.secrets.jwtSecret .Values.secrets.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretsName" . }}
                  key: jwt-secret
            {{- end }}
            {{- if .Values.config.prometheusUrl }}
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.configMapName" . }}
                  key: PROMETHEUS_URL
            {{- end }}
            {{- if .Values.config.alertmanagerUrl }}
            - name: ALERTMANAGER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.configMapName" . }}
                  key: ALERTMANAGER_URL
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
