{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "autosre.fullname" . }}-agent
  labels:
    {{- include "autosre.agent.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
    {{- with .Values.agent.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.agent.service.type }}
  ports:
    - port: {{ .Values.agent.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "autosre.agent.selectorLabels" . | nindent 4 }}
{{- end }}
