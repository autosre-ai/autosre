{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autosre.fullname" . }}-agent
  labels:
    {{- include "autosre.agent.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
spec:
  {{- if not .Values.agent.autoscaling.enabled }}
  replicas: {{ .Values.agent.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "autosre.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "autosre.agent.labels" . | nindent 8 }}
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "autosre.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "autosre.agent.image" . }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Database connections
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: DATABASE_URL
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: NEO4J_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: REDIS_URL
            # LLM configuration
            - name: LITELLM_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.fullname" . }}-config
                  key: LITELLM_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: LITELLM_MASTER_KEY
            - name: DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.fullname" . }}-config
                  key: DEFAULT_MODEL
            # Agent configuration
            - name: AGENT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.fullname" . }}-config
                  key: AGENT_LOG_LEVEL
            - name: AGENT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.fullname" . }}-config
                  key: AGENT_TIMEOUT
            - name: AGENT_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "autosre.fullname" . }}-config
                  key: AGENT_MAX_RETRIES
            # Security
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autosre.secretName" . }}
                  key: API_SECRET_KEY
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.agent.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.agent.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.agent.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        {{- with .Values.agent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
