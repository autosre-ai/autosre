{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autosre.serviceAccountName" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.serviceAccount.create .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autosre.fullname" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
rules:
  # Basic read permissions for debugging and observability
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  {{- with .Values.rbac.rules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autosre.fullname" . }}
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
  annotations:
    {{- include "autosre.annotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autosre.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autosre.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
