# =============================================================================
# AutoSRE Production Values Override
# =============================================================================
# Use this file for production deployments:
#   helm install autosre ./autosre -f values-production.yaml
# =============================================================================

global:
  domain: "autosre.example.com"
  environment: "production"

# -----------------------------------------------------------------------------
# Production Agent Settings
# -----------------------------------------------------------------------------
agent:
  replicaCount: 3

  resources:
    limits:
      cpu: "8"
      memory: 8Gi
    requests:
      cpu: "2"
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: agent
          topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-type
                operator: In
                values:
                  - compute

  config:
    logLevel: WARNING
    timeout: 600
    maxRetries: 5

# -----------------------------------------------------------------------------
# Production API Settings
# -----------------------------------------------------------------------------
api:
  replicaCount: 3

  resources:
    limits:
      cpu: "4"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
          topologyKey: kubernetes.io/hostname

  config:
    workers: 8
    logLevel: warning
    jwtExpirationHours: 8
    corsOrigins: "https://autosre.example.com"

# -----------------------------------------------------------------------------
# Production Web Settings
# -----------------------------------------------------------------------------
web:
  replicaCount: 3

  resources:
    limits:
      cpu: "2"
      memory: 1Gi
    requests:
      cpu: "500m"
      memory: 256Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: web
            topologyKey: kubernetes.io/hostname

  config:
    publicApiUrl: "https://api.autosre.example.com"

# -----------------------------------------------------------------------------
# Production Config (LiteLLM) Settings
# -----------------------------------------------------------------------------
config:
  replicaCount: 2

  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "500m"
      memory: 512Mi

# -----------------------------------------------------------------------------
# Production Ingress Settings
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"

  tls:
    enabled: true
    secretName: autosre-production-tls

  hosts:
    web: "autosre.example.com"
    api: "api.autosre.example.com"

# -----------------------------------------------------------------------------
# Production PDB Settings
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# -----------------------------------------------------------------------------
# Production Network Policy
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  ingressNamespaces:
    - ingress-nginx
    - monitoring
    - istio-system

# -----------------------------------------------------------------------------
# Production Database Settings
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: fast-ssd
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 2Gi

redis:
  enabled: true
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: fast-ssd
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: "500m"
        memory: 256Mi
  replica:
    replicaCount: 2

neo4j:
  enabled: true
  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        requests:
          storage: 50Gi
  resources:
    cpu: "4"
    memory: 8Gi

# -----------------------------------------------------------------------------
# Production Monitoring
# -----------------------------------------------------------------------------
monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    labels:
      release: prometheus

  grafanaDashboard:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"
