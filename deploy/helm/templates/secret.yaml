{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: autosre-secrets
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | required "secrets.secretKey is required when secrets.create is true" | quote }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.slackBotToken }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.pagerdutyApiKey }}
  PAGERDUTY_API_KEY: {{ .Values.secrets.pagerdutyApiKey | quote }}
  {{- end }}
{{- end }}
