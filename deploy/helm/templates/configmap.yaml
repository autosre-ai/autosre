apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autosre.fullname" . }}-config
  labels:
    {{- include "autosre.labels" . | nindent 4 }}
data:
  AUTOSRE_ENV: {{ .Values.api.env.AUTOSRE_ENV | quote }}
  AUTOSRE_DEBUG: {{ .Values.api.env.AUTOSRE_DEBUG | quote }}
  AUTOSRE_LOG_LEVEL: {{ .Values.api.env.AUTOSRE_LOG_LEVEL | quote }}
  AUTOSRE_LOG_FORMAT: {{ .Values.api.env.AUTOSRE_LOG_FORMAT | default "json" | quote }}
  API_WORKERS: {{ .Values.api.env.API_WORKERS | default "4" | quote }}
  NEXT_PUBLIC_API_URL: {{ index .Values.ingress.hosts 0 "host" | printf "https://%s/api" | quote }}
  FEATURE_K8S_OPERATIONS: {{ .Values.features.k8sOperations | quote }}
  FEATURE_AUTO_REMEDIATION: {{ .Values.features.autoRemediation | quote }}
  FEATURE_METRICS_EXPORT: {{ .Values.features.metricsExport | quote }}
