# ═══════════════════════════════════════════════════════════════════════════════
# AutoSRE V2 — Secrets
# ═══════════════════════════════════════════════════════════════════════════════
#
# ⚠️  DO NOT commit this file with real secrets!
#     Use external secrets management (Vault, AWS Secrets Manager, etc.)
#     or sealed-secrets/SOPS for GitOps workflows.
#
# Example: Create secret from command line:
#   kubectl create secret generic autosre-secrets \
#     --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://user:pass@host:5432/db" \
#     --from-literal=OPENAI_API_KEY="sk-..." \
#     -n autosre
#
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: autosre-secrets
  namespace: autosre
  labels:
    app.kubernetes.io/name: autosre
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Application secrets
  SECRET_KEY: "CHANGE_ME_TO_RANDOM_STRING"
  
  # Database credentials
  DATABASE_URL: "postgresql+asyncpg://autosre:CHANGE_ME@autosre-postgres:5432/autosre"
  POSTGRES_USER: "autosre"
  POSTGRES_PASSWORD: "CHANGE_ME"
  
  # Redis credentials (if auth enabled)
  REDIS_URL: "redis://autosre-redis:6379/0"
  # REDIS_PASSWORD: ""
  
  # LLM API keys
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  
  # External integrations
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  PAGERDUTY_API_KEY: ""
  GITHUB_TOKEN: ""
  
  # Monitoring
  DATADOG_API_KEY: ""
  SENTRY_DSN: ""
---
# Image pull secret (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: autosre-registry
  namespace: autosre
  labels:
    app.kubernetes.io/name: autosre
type: kubernetes.io/dockerconfigjson
data:
  # Replace with base64-encoded docker config
  # echo -n '{"auths":{"ghcr.io":{"auth":"BASE64_TOKEN"}}}' | base64
  .dockerconfigjson: e30=
